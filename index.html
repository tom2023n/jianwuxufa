<body>
<canvas id="c"></canvas>
<script>
/* 箭无虚发 —— 受同类箭头消除玩法启发的非官方作品，与任何商业游戏无关；全部图形由代码绘制 */
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif';
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // 上 右 下 左 (dx,dy)
const C = { bg:'#f3efe6', board:'#fbf8f2', dot:'#d6cdbb', arrow:'#2d3047', red:'#e63946', green:'#2a9d8f',
  gold:'#f4a261', text:'#2d3047', sub:'#8a8170', panel:'#fffaf0', heart:'#ef476f', blue:'#3a86ff' };
const DASH_MAX = 8;

// ---------- 存档 ----------
let save = {};
try { save = JSON.parse(localStorage.getItem('jwxf_save') || '{}'); } catch (e) {}
let maxLevel = save.maxLevel || 1, best = save.best || 0, timeFactor = save.timeFactor || 1;
let hintsStock = save.hints != null ? save.hints : 3;
function persist() {
  try { localStorage.setItem('jwxf_save', JSON.stringify({ maxLevel, best, timeFactor, hints: hintsStock })); } catch (e) {}
}

// ---------- 工具 ----------
function rngOf(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- 声音（WebAudio 合成，无外部素材） ----------
let actx = null;
function beep(freq, dur, type, vol, slide) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  fly(c) { beep(520 + Math.min(c, 10) * 60, 0.16, 'triangle', 0.12, 1400 + c * 80); },
  bump() { beep(140, 0.22, 'square', 0.08, 70); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.12), i * 110)); },
  lose() { [392, 330, 262].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sine', 0.12), i * 160)); },
  dash() { beep(300, 0.5, 'sawtooth', 0.06, 1800); },
  clock() { beep(880, 0.12, 'sine', 0.12); setTimeout(() => beep(1320, 0.15, 'sine', 0.12), 90); },
  click() { beep(660, 0.05, 'sine', 0.06); }
};

// ---------- 关卡生成：保证必有解 ----------
// 构造法：依次放置箭头，每支新箭头的“出射线”（箭头尖端到棋盘边缘）上不能有已放置的格子。
// 于是按放置的逆序即可全部清空；且消除只会让通道更空，玩家不可能把自己“堵死”。
function levelParams(n) {
  const cols = Math.min(4 + Math.floor(n * 0.6), 13);
  const rows = Math.min(Math.round(cols * 1.35), 18);
  const maxLen = Math.min(3 + Math.floor(n / 2), 12);
  return { cols, rows, maxLen, seed: n * 7919 + 13 };
}
function genLevel(n) {
  const p = levelParams(n), rng = rngOf(p.seed), cols = p.cols, rows = p.rows;
  const occ = new Int16Array(cols * rows).fill(-1);
  const inb = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;
  const id = (x, y) => y * cols + x;
  const arrows = [];
  for (let tries = 0; tries < 3000; tries++) {
    const empties = [];
    for (let i = 0; i < occ.length; i++) if (occ[i] < 0) empties.push(i);
    if (empties.length < 2) break;
    const h = empties[Math.floor(rng() * empties.length)], hx = h % cols, hy = Math.floor(h / cols);
    const ds = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = ds[i]; ds[i] = ds[j]; ds[j] = t; }
    for (const d of ds) {
      const [dx, dy] = DIRS[d];
      let ok = true; const ray = new Set(); let x = hx + dx, y = hy + dy;
      while (inb(x, y)) { if (occ[id(x, y)] >= 0) { ok = false; break; } ray.add(id(x, y)); x += dx; y += dy; }
      if (!ok) continue;
      const bx = hx - dx, by = hy - dy;
      if (!inb(bx, by) || occ[id(bx, by)] >= 0) continue;
      const target = 2 + Math.floor(rng() * (p.maxLen - 1));
      const path = [[hx, hy], [bx, by]]; const used = new Set([h, id(bx, by)]);
      let pdx = -dx, pdy = -dy;
      while (path.length < target) {
        const [cx, cy] = path[path.length - 1]; const opts = [];
        for (const [ex, ey] of DIRS) { const nx = cx + ex, ny = cy + ey; if (!inb(nx, ny)) continue; const k = id(nx, ny); if (occ[k] < 0 && !used.has(k) && !ray.has(k)) opts.push([ex, ey]); }
        if (!opts.length) break;
        const st = opts.find(o => o[0] === pdx && o[1] === pdy);
        const pick = (st && rng() < 0.5) ? st : opts[Math.floor(rng() * opts.length)];
        const nx = cx + pick[0], ny = cy + pick[1];
        path.push([nx, ny]); used.add(id(nx, ny)); pdx = pick[0]; pdy = pick[1];
      }
      path.reverse(); // 尾 -> 头
      const idx = arrows.length;
      arrows.push({ path, dir: d, rainbow: false });
      for (const [px, py] of path) occ[id(px, py)] = idx;
      break;
    }
  }
  // 彩色箭头（每 3 关出现一次，克制地作为“彩蛋”）
  if (n >= 3 && n % 3 === 0 && arrows.length > 4) arrows[Math.floor(arrows.length / 2)].rainbow = true;
  // 时钟道具：放在某支箭头出射线经过的空格上，箭头飞过即 +5 秒
  const clocks = [];
  if (n >= 2) {
    const cand = [];
    for (const a of arrows) {
      const [hx, hy] = a.path[a.path.length - 1], [dx, dy] = DIRS[a.dir];
      let x = hx + dx, y = hy + dy;
      while (inb(x, y)) { if (occ[id(x, y)] < 0) cand.push([x, y]); x += dx; y += dy; }
    }
    if (cand.length) { const c = cand[Math.floor(rng() * cand.length)]; clocks.push({ x: c[0], y: c[1], taken: false }); }
  }
  return { cols, rows, arrows, occ, clocks };
}

// ---------- 游戏状态 ----------
let W = 0, H = 0, DPR = 1, cs = 40, ox = 0, oy = 0, bw = 0, bh = 0;
let state = 'menu';
let level = 1, cols = 0, rows = 0, arrows = [], occ = null, clocks = [];
let hearts = 3, timeLeft = 0, timeTotal = 0, score = 0, levelScore = 0, combo = 0, lastClear = -9, dash = 0;
let elapsed = 0, hintId = -1, particles = [], floaters = [], rainbowQueue = [], endTimer = 0, loseReason = '';
let shake = 0, flash = 0, dashFlash = 0, buttons = [], hoverId = -1, lastResult = null, toast = null, now = 0;
let pointerType = 'mouse';

const inb = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;
const cid = (x, y) => y * cols + x;

function buildPts(a) {
  const pts = a.path.map(p => p.slice());
  const [hx, hy] = a.path[a.path.length - 1], [dx, dy] = DIRS[a.dir];
  let ray = 0, x = hx + dx, y = hy + dy;
  while (inb(x, y)) { ray++; x += dx; y += dy; }
  const L = a.path.length - 1, ext = ray + L + 4;
  for (let k = 1; k <= ext; k++) pts.push([hx + dx * k, hy + dy * k]);
  a.pts = pts; a.L = L; a.exitS = ray + 1; a.maxS = pts.length - 1 - L;
}

function startLevel(n) {
  level = n;
  const g = genLevel(n);
  cols = g.cols; rows = g.rows; arrows = g.arrows; occ = g.occ; clocks = g.clocks;
  arrows.forEach((a, i) => { a.id = i; a.alive = true; a.anim = null; a.gone = false; buildPts(a); });
  hearts = 3; levelScore = 0; combo = 0; lastClear = -9; dash = 0; hintId = -1; elapsed = 0;
  particles = []; floaters = []; rainbowQueue = []; endTimer = 0; shake = 0; flash = 0; toast = null;
  const base = 12 + arrows.reduce((s, a) => s + 1.3 + a.path.length * 0.12, 0);
  timeTotal = Math.round(base * timeFactor); timeLeft = timeTotal;
  state = 'play'; computeBoard();
}

function canExit(a) {
  const [hx, hy] = a.path[a.path.length - 1], [dx, dy] = DIRS[a.dir];
  let x = hx + dx, y = hy + dy, d = 1;
  while (inb(x, y)) { const o = occ[cid(x, y)]; if (o >= 0) return { ok: false, blocker: o, dist: d, bx: x, by: y }; x += dx; y += dy; d++; }
  return { ok: true, dist: d };
}

function launch(a, auto) {
  a.alive = false;
  for (const [x, y] of a.path) occ[cid(x, y)] = -1;
  a.anim = { type: 'fly', s: 0, age: 0 };
  if (hintId === a.id) hintId = -1;
  // 连击
  if (elapsed - lastClear < 1.4) combo++; else combo = 1;
  lastClear = elapsed;
  const pts = 10 + (combo - 1) * 5 + (a.rainbow ? 50 : 0);
  levelScore += pts; score += pts;
  dash += combo >= 2 ? 1 : 0.35;
  const [hx, hy] = a.path[a.path.length - 1];
  const [px, py] = cellXY(hx, hy);
  floaters.push({ x: px, y: py - cs * 0.3, text: '+' + pts + (combo >= 3 ? '  连击×' + combo : ''), life: 0.9, col: combo >= 3 ? C.gold : C.green });
  burst(px, py, a.rainbow ? null : C.arrow, a.rainbow ? 22 : 10);
  sfx.fly(combo);
  // 时钟道具
  const [dx, dy] = DIRS[a.dir]; let x = hx + dx, y = hy + dy;
  while (inb(x, y)) {
    for (const c of clocks) if (!c.taken && c.x === x && c.y === y) {
      c.taken = true; timeLeft += 5; const [cx, cy] = cellXY(x, y);
      floaters.push({ x: cx, y: cy, text: '+5秒', life: 1.2, col: C.blue, big: true }); burst(cx, cy, C.blue, 16); sfx.clock();
    }
    x += dx; y += dy;
  }
  // 冲刺条
  if (dash >= DASH_MAX) {
    dash = 0; dashFlash = 1; timeLeft += 3; levelScore += 100; score += 100;
    floaters.push({ x: W / 2, y: oy + bh / 2, text: '冲刺！+100  +3秒', life: 1.4, col: C.gold, big: true });
    sfx.dash(); if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
  }
  // 彩色箭头：额外帮你清掉最多 3 支当前可飞出的箭头
  if (a.rainbow) {
    floaters.push({ x: W / 2, y: oy + bh * 0.35, text: '彩虹连消！', life: 1.4, col: '#9b5de5', big: true });
    for (let k = 1; k <= 3; k++) rainbowQueue.push(0.12 * k);
  }
}

function tapArrow(a) {
  if (!a || !a.alive || (a.anim && a.anim.type === 'bump')) return;
  const r = canExit(a);
  if (r.ok) { launch(a); return; }
  // 被挡住：前冲碰撞再弹回，扣爱心
  a.anim = { type: 'bump', t: 0, dur: 0.38, dist: Math.max(0.3, r.dist - 0.62), blocker: r.blocker };
  const b = arrows[r.blocker]; if (b) b.hitFlash = 0.5;
  hearts--; shake = 0.3; flash = 0.25; combo = 0; sfx.bump();
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  const [hx, hy] = a.path[a.path.length - 1]; const [px, py] = cellXY(hx, hy);
  floaters.push({ x: px, y: py - cs * 0.3, text: r.blocker === a.id ? '撞到自己尾巴了！' : '前方有阻挡！', life: 1, col: C.red });
  if (hearts <= 0) { loseReason = '爱心用完了'; endTimer = 0.0001; }
}

function useHint() {
  if (state !== 'play') return;
  if (hintId >= 0 && arrows[hintId].alive) return;
  if (hintsStock <= 0) { toast = { text: '提示用完了（每过一关 +1）', life: 1.6 }; return; }
  // 任意可飞出的箭头都是安全的；优先选挡住别人最多的那支
  let bestA = null, bestScore = -1;
  for (const a of arrows) if (a.alive && canExit(a).ok) {
    let blocks = 0; for (const b of arrows) if (b.alive && b !== a) { const r = canExit(b); if (!r.ok && r.blocker === a.id) blocks++; }
    if (blocks > bestScore) { bestScore = blocks; bestA = a; }
  }
  if (bestA) { hintId = bestA.id; hintsStock--; persist(); sfx.click(); }
}

function win() {
  state = 'win';
  const stars = hearts >= 3 ? 3 : hearts === 2 ? 2 : 1;
  const bonus = Math.round(timeLeft) * 5;
  score += bonus; levelScore += bonus;
  best = Math.max(best, score); maxLevel = Math.max(maxLevel, level + 1);
  hintsStock = Math.min(9, hintsStock + 1);
  timeFactor = Math.max(0.85, timeFactor * 0.97);
  lastResult = { stars, bonus, time: elapsed };
  persist(); sfx.win();
  for (let i = 0; i < 40; i++) burst(W / 2 + (Math.random() - 0.5) * W * 0.6, H * 0.3, null, 1);
}
function lose(reason) {
  state = 'lose'; loseReason = reason;
  if (reason === '时间到了') timeFactor = Math.min(1.6, timeFactor * 1.12); // 动态时间：没赶上就多给点时间
  best = Math.max(best, score); persist(); sfx.lose();
}

// ---------- 布局 ----------
function resize() {
  const rc = cv.getBoundingClientRect(); W = Math.round(rc.width) || innerWidth; H = Math.round(rc.height) || innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (cols) computeBoard();
}
function computeBoard() {
  const top = 112, bot = 96;
  const aw = W - 36, ah = H - top - bot - 28;
  cs = Math.max(8, Math.min(aw / cols, ah / rows, 62));
  bw = cs * cols; bh = cs * rows; ox = (W - bw) / 2; oy = top + 14 + (ah - bh) / 2;
}
const cellXY = (x, y) => [ox + (x + 0.5) * cs, oy + (y + 0.5) * cs];

// ---------- 粒子 / 飘字 ----------
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.4, col: col || `hsl(${Math.random() * 360},80%,60%)`, r: 2 + Math.random() * 3 });
  }
}

// ---------- 更新 ----------
function update(dt) {
  now += dt;
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 40 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt); dashFlash = Math.max(0, dashFlash - dt * 1.5);
  if (state !== 'play') return;
  elapsed += dt;
  if (endTimer === 0) timeLeft -= dt;
  dash = Math.max(0, dash - dt * 0.25);
  for (const a of arrows) {
    if (a.hitFlash) a.hitFlash = Math.max(0, a.hitFlash - dt);
    const an = a.anim; if (!an) continue;
    if (an.type === 'fly') {
      an.age += dt; an.s += (10 + 55 * an.age) * dt;
      if (an.s >= a.maxS) { a.anim = null; a.gone = true; }
    } else if (an.type === 'bump') {
      an.t += dt; if (an.t >= an.dur) a.anim = null;
    }
  }
  if (rainbowQueue.length) {
    rainbowQueue = rainbowQueue.map(t => t - dt);
    while (rainbowQueue.length && rainbowQueue[0] <= 0) {
      rainbowQueue.shift();
      const free = arrows.filter(a => a.alive && !(a.anim && a.anim.type === 'bump') && canExit(a).ok);
      if (free.length) launch(free[Math.floor(Math.random() * free.length)], true);
    }
  }
  if (endTimer > 0) { endTimer += dt; if (endTimer > 0.6) { lose(loseReason); return; } }
  if (timeLeft <= 0 && endTimer === 0) { timeLeft = 0; lose('时间到了'); return; }
  if (!arrows.some(a => a.alive || a.anim)) win();
}

// ---------- 绘制 ----------
function ptAt(pts, t) {
  const i = clamp(Math.floor(t), 0, pts.length - 2), f = t - i;
  const a = pts[i], b = pts[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}
function dirAt(pts, t) {
  const i = clamp(Math.ceil(t) - 1, 0, pts.length - 2);
  return [pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]];
}
function drawArrowShape(a, s, color, alpha, glow) {
  const t0 = s, t1 = s + a.L, pts = a.pts;
  const list = [ptAt(pts, t0)];
  for (let i = Math.floor(t0) + 1; i < t1; i++) list.push(pts[i]);
  list.push(ptAt(pts, t1));
  const P = list.map(([x, y]) => [ox + (x + 0.5) * cs, oy + (y + 0.5) * cs]);
  ctx.save(); ctx.globalAlpha = alpha;
  let stroke = color;
  if (a.rainbow) {
    const g = ctx.createLinearGradient(P[0][0], P[0][1], P[P.length - 1][0] + 1, P[P.length - 1][1] + 1);
    const h0 = (now * 120) % 360;
    for (let k = 0; k <= 5; k++) g.addColorStop(k / 5, `hsl(${(h0 + k * 60) % 360},85%,55%)`);
    stroke = g;
  }
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = cs * 0.5; }
  ctx.strokeStyle = stroke; ctx.fillStyle = stroke;
  ctx.lineWidth = Math.max(3, cs * 0.2); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  const [ddx, ddy] = dirAt(pts, t1);
  const head = P[P.length - 1];
  const hl = cs * 0.34, hw = cs * 0.26;
  // 线身止于箭头底部，避免穿出尖端
  for (let i = 1; i < P.length - 1; i++) ctx.lineTo(P[i][0], P[i][1]);
  ctx.lineTo(head[0] - ddx * hl * 0.6, head[1] - ddy * hl * 0.6);
  ctx.stroke();
  // 尖端三角
  const tipX = head[0] + ddx * hl * 0.55, tipY = head[1] + ddy * hl * 0.55;
  const bx = head[0] - ddx * hl * 0.55, by = head[1] - ddy * hl * 0.55;
  ctx.beginPath(); ctx.moveTo(tipX, tipY);
  ctx.lineTo(bx - ddy * hw, by + ddx * hw); ctx.lineTo(bx + ddy * hw, by - ddx * hw); ctx.closePath();
  ctx.lineWidth = Math.max(2, cs * 0.08); ctx.stroke(); ctx.fill();
  // 尾端小圆点
  ctx.beginPath(); ctx.arc(P[0][0], P[0][1], Math.max(2, cs * 0.12), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawHeart(x, y, s, filled) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 32, s / 32);
  ctx.beginPath(); ctx.moveTo(0, 10);
  ctx.bezierCurveTo(-16, -2, -14, -16, -6, -16); ctx.bezierCurveTo(-2, -16, 0, -13, 0, -10);
  ctx.bezierCurveTo(0, -13, 2, -16, 6, -16); ctx.bezierCurveTo(14, -16, 16, -2, 0, 10); ctx.closePath();
  if (filled) { ctx.fillStyle = C.heart; ctx.fill(); } else { ctx.strokeStyle = '#c9bfae'; ctx.lineWidth = 2.5; ctx.stroke(); }
  ctx.restore();
}
function drawClock(x, y, r) {
  ctx.save(); const pulse = 1 + Math.sin(now * 5) * 0.08;
  ctx.shadowColor = C.blue; ctx.shadowBlur = 14;
  ctx.fillStyle = '#e7f0ff'; ctx.strokeStyle = C.blue; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y, r * pulse, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - r * 0.6); ctx.moveTo(x, y); ctx.lineTo(x + r * 0.45, y); ctx.stroke();
  ctx.fillStyle = C.blue; ctx.font = `bold ${Math.max(9, r * 0.6)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('+5', x, y + r * 1.05); ctx.restore();
}

function button(x, y, w, h, label, cb, style) {
  buttons.push({ x, y, w, h, cb });
  ctx.save();
  const primary = style === 'primary';
  ctx.shadowColor = 'rgba(0,0,0,.12)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillStyle = primary ? C.arrow : '#fff'; rr(x, y, w, h, h / 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  if (!primary) { ctx.strokeStyle = '#ddd3c0'; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.fillStyle = primary ? '#fff' : C.text; ctx.font = `bold ${Math.round(h * 0.38)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = C.text; ctx.textBaseline = 'middle';
  ctx.font = `bold 22px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText(`第 ${level} 关`, 18, 34);
  ctx.textAlign = 'right'; ctx.font = `bold 18px ${FONT}`; ctx.fillText(`得分 ${score}`, W - 18, 34);
  for (let i = 0; i < 3; i++) drawHeart(W / 2 - 34 + i * 34, 36, 26, i < hearts);
  // 倒计时条
  const x = 18, y = 64, w = W - 36, h = 14, r = clamp(timeLeft / timeTotal, 0, 1);
  ctx.fillStyle = '#e4dccb'; rr(x, y, w, h, 7); ctx.fill();
  const col = r > 0.5 ? C.green : r > 0.2 ? '#e9c46a' : C.red;
  const blink = r <= 0.2 && Math.sin(now * 12) > 0;
  ctx.fillStyle = blink ? '#ff8a8a' : col; if (r > 0.01) { rr(x, y, Math.max(h, w * r), h, 7); ctx.fill(); }
  ctx.fillStyle = C.sub; ctx.font = `13px ${FONT}`; ctx.textAlign = 'left';
  const left = arrows.filter(a => a.alive).length;
  ctx.fillText(`剩余箭头 ${left}`, 18, 92);
  ctx.textAlign = 'right'; ctx.fillText(`⏱ ${Math.ceil(timeLeft)} 秒`, W - 18, 92);
  ctx.textAlign = 'center'; if (combo >= 2 && elapsed - lastClear < 1.4) { ctx.fillStyle = C.gold; ctx.font = `bold 15px ${FONT}`; ctx.fillText(`连击 ×${combo}`, W / 2, 92); }
}

function drawBoard() {
  // 冲刺条：棋盘上下两条线槽
  const pad = 10;
  ctx.fillStyle = C.board; ctx.shadowColor = 'rgba(0,0,0,.06)'; ctx.shadowBlur = 16;
  rr(ox - pad, oy - pad, bw + pad * 2, bh + pad * 2, 16); ctx.fill(); ctx.shadowBlur = 0;
  const r = clamp(dash / DASH_MAX, 0, 1);
  for (const yy of [oy - pad - 9, oy + bh + pad + 4]) {
    ctx.fillStyle = '#e4dccb'; rr(ox - pad, yy, bw + pad * 2, 5, 2.5); ctx.fill();
    if (r > 0) { const g = ctx.createLinearGradient(ox, 0, ox + bw, 0); g.addColorStop(0, '#f4a261'); g.addColorStop(1, '#e76f51');
      ctx.fillStyle = g; rr(ox - pad, yy, (bw + pad * 2) * r, 5, 2.5); ctx.fill(); }
  }
  if (dashFlash > 0) { ctx.fillStyle = `rgba(244,162,97,${dashFlash * 0.35})`; rr(ox - pad, oy - pad, bw + pad * 2, bh + pad * 2, 16); ctx.fill(); }
  // 点阵
  ctx.fillStyle = C.dot;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const [px, py] = cellXY(x, y); ctx.beginPath(); ctx.arc(px, py, Math.max(1.5, cs * 0.07), 0, Math.PI * 2); ctx.fill();
  }
  for (const c of clocks) if (!c.taken) { const [px, py] = cellXY(c.x, c.y); drawClock(px, py, cs * 0.3); }
  // 辅助线（鼠标悬停时显示前方通道）
  if (hoverId >= 0 && pointerType === 'mouse' && arrows[hoverId] && arrows[hoverId].alive) {
    const a = arrows[hoverId], r2 = canExit(a), [hx, hy] = a.path[a.path.length - 1], [dx, dy] = DIRS[a.dir];
    const [sx, sy] = cellXY(hx, hy);
    const end = r2.ok ? cellXY(hx + dx * r2.dist, hy + dy * r2.dist) : cellXY(r2.bx, r2.by);
    ctx.save(); ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.strokeStyle = r2.ok ? C.green : C.red; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(end[0], end[1]); ctx.stroke(); ctx.restore();
  }
  // 箭头：静止的先画，飞行的后画
  for (const a of arrows) {
    if (a.gone || (a.anim && a.anim.type === 'fly')) continue;
    let s = 0, color = C.arrow, glow = null;
    if (a.anim && a.anim.type === 'bump') { const p = a.anim.t / a.anim.dur; s = a.anim.dist * Math.sin(Math.PI * p); color = C.red; }
    if (a.hitFlash > 0) color = C.red;
    if (a.id === hintId) { glow = C.green; color = Math.sin(now * 8) > 0 ? C.green : C.arrow; }
    if (a.id === hoverId && pointerType === 'mouse' && color === C.arrow) color = '#4a4e7a';
    drawArrowShape(a, s, color, 1, glow);
  }
  for (const a of arrows) {
    if (!a.anim || a.anim.type !== 'fly') continue;
    const s = a.anim.s, alpha = clamp(1 - (s - a.exitS) / (a.L + 3), 0, 1);
    drawArrowShape(a, s, C.arrow, alpha, null);
  }
}

function drawPlay() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake / 0.3, (Math.random() - 0.5) * 6 * shake / 0.3);
  drawHUD(); drawBoard();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(230,57,70,${flash * 0.4})`; ctx.fillRect(0, 0, W, H); }
  const bw2 = Math.min(150, (W - 60) / 3), by = H - 70;
  if (state === 'play') {
    button(W / 2 - bw2 * 1.5 - 12, by, bw2, 48, '主页', () => { state = 'menu'; });
    button(W / 2 - bw2 / 2, by, bw2, 48, `提示 (${hintsStock})`, useHint, 'primary');
    button(W / 2 + bw2 / 2 + 12, by, bw2, 48, '重开', () => startLevel(level));
  }
}

function drawFX() {
  for (const p of particles) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life * 2, 0, 1); ctx.fillStyle = f.col; ctx.font = `bold ${f.big ? 26 : 16}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (toast) {
    ctx.font = `15px ${FONT}`; const tw = ctx.measureText(toast.text).width + 36;
    ctx.fillStyle = 'rgba(45,48,71,.9)'; rr(W / 2 - tw / 2, H - 130, tw, 38, 19); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toast.text, W / 2, H - 111);
  }
}

// 主菜单的装饰箭头
const menuDeco = (() => { const g = genLevel(4); g.arrows.forEach((a, i) => { a.id = i; a.alive = true; }); return g; })();
function drawMenu() {
  // 背景淡淡的箭头点阵
  const saved = { cols, rows, cs, ox, oy, arrows, occ };
  cols = menuDeco.cols; rows = menuDeco.rows; cs = Math.max(W, H) / Math.max(cols, rows) * 0.9;
  ox = (W - cs * cols) / 2; oy = (H - cs * rows) / 2;
  for (const a of menuDeco.arrows) { if (!a.pts) buildPts(a); drawArrowShape(a, 0, C.arrow, 0.07, null); }
  ({ cols, rows, cs, ox, oy, arrows, occ } = saved);

  const cy = H * 0.3;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.text; ctx.font = `900 ${Math.min(56, W * 0.13)}px ${FONT}`; ctx.fillText('箭无虚发', W / 2, cy);
  // 标题下的飞行箭头
  const t = (now % 2.2) / 2.2, ax = W / 2 - 120 + 240 * t, ay = cy + 52;
  ctx.strokeStyle = C.arrow; ctx.fillStyle = C.arrow; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.globalAlpha = Math.min(1, (1 - t) * 3);
  ctx.beginPath(); ctx.moveTo(ax - 70, ay); ctx.lineTo(ax - 8, ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax + 8, ay); ctx.lineTo(ax - 10, ay - 11); ctx.lineTo(ax - 10, ay + 11); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.sub; ctx.font = `16px ${FONT}`;
  ctx.fillText('箭头迷宫 · 点击箭头，让它冲出去', W / 2, cy + 96);
  const bw2 = Math.min(260, W - 60);
  button(W / 2 - bw2 / 2, H * 0.55, bw2, 56, maxLevel > 1 ? `继续 · 第 ${maxLevel} 关` : '开始游戏', () => { score = 0; startLevel(maxLevel); }, 'primary');
  if (maxLevel > 1) button(W / 2 - bw2 / 2, H * 0.55 + 72, bw2, 48, '从第 1 关开始', () => { score = 0; startLevel(1); });
  ctx.fillStyle = C.sub; ctx.font = `13px ${FONT}`; ctx.textAlign = 'center';
  const lines = ['规则：箭头只能沿尖端方向飞出，前方被挡住会扣 1 颗爱心', '清空所有箭头即过关 · 爱心或时间用完则失败', `最高分 ${best}`];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H * 0.55 + 150 + i * 22));
  ctx.fillStyle = '#b7ad9a'; ctx.font = `11px ${FONT}`; ctx.fillText('受同类箭头消除玩法启发的非官方作品，与任何商业游戏无关', W / 2, H - 18);
}

function drawPanel(title, sub, lines, btns) {
  ctx.fillStyle = 'rgba(45,48,71,.45)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(340, W - 40), ph = 300, px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = C.panel; ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 24; rr(px, py, pw, ph, 22); ctx.fill(); ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.text; ctx.font = `900 32px ${FONT}`; ctx.fillText(title, W / 2, py + 48);
  if (sub) sub(py);
  ctx.fillStyle = C.sub; ctx.font = `15px ${FONT}`;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, py + 150 + i * 24));
  const bw2 = (pw - 60) / 2;
  btns.forEach((b, i) => button(px + 20 + i * (bw2 + 20), py + ph - 74, bw2, 50, b[0], b[1], i === btns.length - 1 ? 'primary' : ''));
}
function drawStar(x, y, r, on) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = on ? '#ffbe0b' : '#e4dccb'; ctx.fill();
}

function render() {
  buttons = [];
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (state === 'menu') drawMenu();
  else {
    drawPlay();
    if (state === 'win') {
      drawPanel('过关！', (py) => { for (let i = 0; i < 3; i++) drawStar(W / 2 - 50 + i * 50, py + 100, i === 1 ? 24 : 20, i < lastResult.stars); },
        [`本关得分 ${levelScore}（含剩余时间奖励 ${lastResult.bonus}）`, `用时 ${lastResult.time.toFixed(1)} 秒 · 总分 ${score}`],
        [['重玩', () => { score = Math.max(0, score - levelScore); startLevel(level); }], ['下一关', () => startLevel(level + 1)]]);
    } else if (state === 'lose') {
      drawPanel('挑战失败', (py) => { ctx.fillStyle = C.red; ctx.font = `bold 18px ${FONT}`; ctx.fillText(loseReason, W / 2, py + 98); },
        [loseReason === '时间到了' ? '下次会多给你一点时间～' : '先找前方畅通的箭头再点哦', `总分 ${score} · 最高分 ${best}`],
        [['主页', () => { state = 'menu'; }], ['再试一次', () => { score = Math.max(0, score - levelScore); startLevel(level); }]]);
    }
  }
  drawFX();
}

// ---------- 输入（鼠标 + 触屏统一用 Pointer Events） ----------
function arrowAt(px, py) {
  const fx = (px - ox) / cs, fy = (py - oy) / cs, gx = Math.floor(fx), gy = Math.floor(fy);
  if (inb(gx, gy)) { const o = occ[cid(gx, gy)]; if (o >= 0 && arrows[o].alive) return arrows[o]; }
  // 容错：点在线条附近也算
  let bestA = null, bd = 0.55;
  for (const a of arrows) if (a.alive) for (let i = 0; i < a.path.length; i++) {
    const d = Math.hypot(a.path[i][0] + 0.5 - fx, a.path[i][1] + 0.5 - fy); if (d < bd) { bd = d; bestA = a; }
  }
  return bestA;
}
cv.addEventListener('pointerdown', e => {
  pointerType = e.pointerType || 'mouse';
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  const rc0 = cv.getBoundingClientRect(); const x = e.clientX - rc0.left, y = e.clientY - rc0.top; e.preventDefault();
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sfx.click(); b.cb(); return; }
  if (state === 'play' && endTimer === 0) tapArrow(arrowAt(x, y));
});
cv.addEventListener('pointermove', e => {
  pointerType = e.pointerType || 'mouse';
  const rc1 = cv.getBoundingClientRect(); const mx = e.clientX - rc1.left, my = e.clientY - rc1.top;
  if (state === 'play') { const a = arrowAt(mx, my); hoverId = a ? a.id : -1; }
  let over = false; for (const b of buttons) if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) over = true;
  cv.style.cursor = over || hoverId >= 0 ? 'pointer' : 'default';
});
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'h' || e.key === 'H') useHint();
  if (e.key === 'r' || e.key === 'R') startLevel(level);
});
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
// 禁止 iOS 双击缩放、双指缩放、页面回弹滚动
['gesturestart', 'gesturechange', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = t; }, { passive: false });
// 离线缓存（Service Worker），相对路径适配 GitHub Pages 子路径
window.__swStatus = 'unsupported';
if ('serviceWorker' in navigator) {
  window.__swStatus = 'pending';
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(r => { window.__swStatus = 'registered'; return navigator.serviceWorker.ready; })
      .then(() => { window.__swStatus = 'ready'; })
      .catch(err => { window.__swStatus = 'error: ' + err.message; });
  });
}

// ---------- 主循环 ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);

// 调试/测试接口
window.__game = {
  get state() { return state; }, get level() { return level; }, get hearts() { return hearts; },
  get left() { return arrows.filter(a => a.alive).length; }, get score() { return score; },
  start(n) { score = 0; startLevel(n || 1); },
  tapFree() { const a = arrows.find(a => a.alive && canExit(a).ok); if (a) tapArrow(a); return !!a; },
  tapBlocked() { const a = arrows.find(a => a.alive && !canExit(a).ok); if (a) tapArrow(a); return !!a; },
  cellCenter(id) { const a = arrows[id]; const h = a.path[a.path.length - 1]; return cellXY(h[0], h[1]); },
  freeIds() { return arrows.filter(a => a.alive && canExit(a).ok).map(a => a.id); },
  blockedIds() { return arrows.filter(a => a.alive && !canExit(a).ok).map(a => a.id); },
  solvable(n) { const g = genLevel(n); const al = g.arrows.map(() => true); let occ2 = g.occ; let changed = true;
    const ce = (a) => { const [hx, hy] = a.path[a.path.length - 1], [dx, dy] = DIRS[a.dir]; let x = hx + dx, y = hy + dy;
      while (x >= 0 && y >= 0 && x < g.cols && y < g.rows) { if (occ2[y * g.cols + x] >= 0) return false; x += dx; y += dy; } return true; };
    while (changed) { changed = false; g.arrows.forEach((a, i) => { if (al[i] && ce(a)) { al[i] = false; changed = true; for (const [x, y] of a.path) occ2[y * g.cols + x] = -1; } }); }
    return { arrows: g.arrows.length, cols: g.cols, rows: g.rows, solved: al.every(v => !v) }; }
};
})();
</script>
