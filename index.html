<script>
/* 箭无虚发 —— 受同类箭头消除玩法启发的非官方作品，与任何商业游戏无关；全部图形由代码绘制 */
(() => {
'use strict';
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif';
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // 上 右 下 左 (dx,dy)
const C = { bg:'#f3efe6', board:'#fbf8f2', dot:'#d6cdbb', arrow:'#2d3047', red:'#e63946', green:'#2a9d8f',
  gold:'#f4a261', text:'#2d3047', sub:'#8a8170', panel:'#fffaf0', heart:'#ef476f', blue:'#3a86ff' };
const DASH_MAX = 8;

// ---------- 存档 ----------
let save = {};
try { save = JSON.parse(localStorage.getItem('jwxf_save') || '{}'); } catch (e) {}
let diff = save.diff != null ? save.diff : 1;               // 0 普通 1 困难（默认） 2 地狱
let prog = Array.isArray(save.prog) ? save.prog : [1, save.maxLevel || 1, 1];
let maxLevel = prog[diff] || 1, best = save.best || 0, timeFactor = save.timeFactor || 1;
let hintsStock = save.hints != null ? save.hints : 3;
function persist() {
  prog[diff] = maxLevel;
  try { localStorage.setItem('jwxf_save', JSON.stringify({ v: 2, diff, prog, best, timeFactor, hints: hintsStock })); } catch (e) {}
}
function setDiff(d) { prog[diff] = maxLevel; diff = d; maxLevel = prog[diff] || 1; persist(); }

// ---------- 工具 ----------
function rngOf(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- 声音（WebAudio 合成，无外部素材） ----------
let actx = null;
function beep(freq, dur, type, vol, slide) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  fly(c) { beep(520 + Math.min(c, 10) * 60, 0.16, 'triangle', 0.12, 1400 + c * 80); },
  bump() { beep(140, 0.22, 'square', 0.08, 70); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.12), i * 110)); },
  lose() { [392, 330, 262].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sine', 0.12), i * 160)); },
  dash() { beep(300, 0.5, 'sawtooth', 0.06, 1800); },
  clock() { beep(880, 0.12, 'sine', 0.12); setTimeout(() => beep(1320, 0.15, 'sine', 0.12), 90); },
  click() { beep(660, 0.05, 'sine', 0.06); }

// ---------- 关卡生成：保证必有解 ----------
// 构造法：依次放置箭头，每支新箭头的“出射线”（箭头尖端沿方向直到离开整个棋盘外框）上不能有已放置的格子，
// 且箭身不能压住自己的出射线。于是按放置的逆序即可全部清空；消除只会让通道更空，玩家不可能把自己“堵死”。

const DIFFS = [
  { name: '普通', startS: 5, Lmax: 25, minLen: 2, len0: 3, lenMax: 8,  lenPost: 15, lenCap: 14, pS0: 0.55, pS1: 0.45, K0: 3,  K1: 8,  noise: 1.5, dW: 0.4, tA: 1.6,  tL: 0.12, tB: 12, hearts: 3, rainbow: 3 },
  { name: '困难', startS: 6, Lmax: 15, minLen: 3, len0: 4, lenMax: 10, lenPost: 12, lenCap: 15, pS0: 0.42, pS1: 0.30, K0: 8,  K1: 20, noise: 0.6, dW: 1.5, tA: 1.05, tL: 0.09, tB: 8,  hearts: 3, rainbow: 5 },
  { name: '地狱', startS: 8, Lmax: 10, minLen: 4, len0: 6, lenMax: 12, lenPost: 10, lenCap: 18, pS0: 0.30, pS1: 0.20, K0: 20, K1: 40, noise: 0.3, dW: 2.5, tA: 0.8,  tL: 0.07, tB: 6,  hearts: 2, rainbow: 0 }
];
const MAX_S = 16;
const DEFAULT_CAP = { mc: 14, mr: 18 };
function levelParams(n, d) {
  const D = DIFFS[d], t = clamp((n - 1) / (D.Lmax - 1), 0, 1), post = Math.max(0, n - D.Lmax);
  const size = Math.round(D.startS + (MAX_S - D.startS) * t);
  const maxLen = Math.min(D.lenCap, Math.round(D.len0 + (D.lenMax - D.len0) * t + post / D.lenPost));
  const minLen = Math.min(n <= 2 ? 2 : D.minLen, maxLen);
  const pStraight = Math.max(0.12, D.pS0 + (D.pS1 - D.pS0) * t - post * 0.003);
  const K = Math.round(Math.min(60, D.K0 + (D.K1 - D.K0) * t + post / 4));
  const timeMul = Math.max(0.7, 1 - post * 0.004);

  return { size, minLen, maxLen, pStraight, K, timeMul, dW, noise: D.noise, seed: n * 7919 + 13 + d * 104729 };

// 异形棋盘：u、v 为格点中心归一化坐标（-1..1，v 向下），返回该格点是否可用
function inPoly(u, v, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > v) !== (yj > v) && u < (xj - xi) * (v - yi) / (yj - yi) + xi) c = !c; } return c; }
const STAR = (() => { const P = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.47 : 1.04; P.push([Math.cos(a) * r, Math.sin(a) * r + 0.1]); } return P; })();
const SHAPES = {
  rect:     { name: '方形', aspect: 1.3,  f: () => true },
  circle:   { name: '圆形', aspect: 1.0,  f: (u, v) => u * u + v * v <= 1.02 },
  ellipse:  { name: '椭圆', aspect: 1.4,  f: (u, v) => u * u + v * v <= 1.02 },
  heart:    { name: '心形', aspect: 0.95, f: (u, v) => { const X = u * 1.28, Y = -v * 1.32 + 0.18; const q = X * X + Y * Y - 1; return q * q * q - X * X * Y * Y * Y <= 0; } },
  diamond:  { name: '菱形', aspect: 1.25, f: (u, v) => Math.abs(u) + Math.abs(v) <= 1.04 },
  cross:    { name: '十字', aspect: 1.0,  f: (u, v) => Math.abs(u) <= 0.36 || Math.abs(v) <= 0.36 },
  hourglass:{ name: '沙漏', aspect: 1.3,  f: (u, v) => Math.abs(u) <= 0.2 + 0.85 * Math.abs(v) },
  stairs:   { name: '阶梯', aspect: 1.1,  f: (u, v) => { const k = Math.min(4, Math.floor((u + 1) / 2 * 5)); return (v + 1) / 2 >= 1 - (k + 1) / 5 - 0.001; } },
  star:     { name: '星形', aspect: 1.0,  complex: true, f: (u, v) => inPoly(u, v, STAR) },
  ring:     { name: '环形', aspect: 1.0,  complex: true, f: (u, v) => { const r = u * u + v * v; return r <= 1.02 && r >= 0.2; } },
  frame:    { name: '回字', aspect: 1.2,  complex: true, f: (u, v) => Math.max(Math.abs(u), Math.abs(v)) >= 0.42 },
  cat:      { name: '猫头', aspect: 1.0,  complex: true, f: (u, v) => {
      if ((u - 0.4) ** 2 + (v - 0.12) ** 2 < 0.03 || (u + 0.4) ** 2 + (v - 0.12) ** 2 < 0.03) return false; // 眼睛
      return (u / 1.0) ** 2 + ((v - 0.25) / 0.75) ** 2 <= 1 || inPoly(u, v, [[-1, -1.05], [-0.98, -0.1], [-0.25, -0.45]]) || inPoly(u, v, [[1, -1.05], [0.98, -0.1], [0.25, -0.45]]); } },
  skull:    { name: '骷髅', aspect: 1.1,  complex: true, f: (u, v) => {
      if ((u - 0.37) ** 2 + (v + 0.12) ** 2 < 0.055 || (u + 0.37) ** 2 + (v + 0.12) ** 2 < 0.055) return false; // 眼眶
      if (Math.abs(u) < 0.12 && v > 0.15 && v < 0.38) return false;                                        // 鼻孔
      if (v > 0.72 && Math.abs(u) < 0.5 && Math.floor((u + 1) * 4.5) % 2 === 1) return false;             // 牙缝
      return u * u + ((v + 0.22) / 0.8) ** 2 <= 1 || (Math.abs(u) <= 0.55 && v >= 0.2); } },
  house:    { name: '小屋', aspect: 1.1,  complex: true, f: (u, v) => {
      if (Math.abs(u) <= 0.2 && v >= 0.45) return false;                                                    // 门
      return v < -0.15 ? Math.abs(u) <= (v + 1.02) / 0.87 : Math.abs(u) <= 0.78; } }
};
const SIMPLE_POOL = ['circle', 'heart', 'diamond', 'cross', 'ellipse', 'hourglass', 'stairs'];
const FULL_POOL = ['heart', 'star', 'circle', 'cat', 'diamond', 'ring', 'cross', 'skull', 'hourglass', 'house', 'ellipse', 'frame', 'stairs'];
function pickShape(n, d, size) {

  for (let y = 0; y < gr; y++) for (let x = 0; x < gc; x++) {
    const u = (x + 0.5) / gc * 2 - 1, v = (y + 0.5) / gr * 2 - 1;
    const ok = sh.f(u, v) ? 1 : 0; m.push(ok);
    if (ok) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }

// 多生成几版同一关，挑“开局可飞箭头占比最低、依赖链最深”的那版（困难/地狱生成更多版）

  const t0 = (typeof performance !== 'undefined' ? performance.now() : 0);
  const tries = [1, 4, 8][d] + Math.min(4, Math.floor(Math.max(0, n - DIFFS[d].Lmax) / 20));
  let best = null, bs = -1e9;
  for (let k = 0; k < tries; k++) {
    const g = genOnce(n, d, cap, k);
    const sc = g.depth * 1.2 - (g.freeStart / Math.max(1, g.arrows.length)) * 12 + g.fill * 3;
    if (sc > bs) { bs = sc; best = g; }

  return best;
}
function genOnce(n, d, cap, salt) {

  let gc = Math.min(p.size, cap.mc);
  const key = pickShape(n, d, gc), sh = SHAPES[key];

  const occ = new Int16Array(N).fill(-1);
  const rayOwn = Array.from({ length: N }, () => []);
  const inb = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;
  const id = (x, y) => y * cols + x;

  function build(h, dir, target, minL) {
    const hx = h % cols, hy = (h / cols) | 0, [dx, dy] = DIRS[dir];
    const ray = []; let x = hx + dx, y = hy + dy;
    while (inb(x, y)) { if (occ[id(x, y)] >= 0) return null; ray.push(id(x, y)); x += dx; y += dy; }
    const raySet = new Set(ray);
    const bx = hx - dx, by = hy - dy;
    if (!free(bx, by)) return null;
    const path = [[hx, hy], [bx, by]], used = new Set([h, id(bx, by)]);
    let pdx = -dx, pdy = -dy;
    while (path.length < target) {
      const [cx, cy] = path[path.length - 1], opts = [];
      for (const [ex, ey] of DIRS) { const nx = cx + ex, ny = cy + ey; if (!free(nx, ny)) continue; const k = id(nx, ny); if (!used.has(k) && !raySet.has(k)) opts.push([ex, ey]); }
      if (!opts.length) break;
      const st = opts.find(o => o[0] === pdx && o[1] === pdy);
      const turns = opts.filter(o => o !== st);
      const pick = (st && (rng() < p.pStraight || !turns.length)) ? st : turns[Math.floor(rng() * turns.length)];
      const nx = cx + pick[0], ny = cy + pick[1];

    for (const a of arrows) {

// ---------- 游戏状态 ----------
let W = 0, H = 0, DPR = 1, cs = 40, ox = 0, oy = 0, bw = 0, bh = 0;
let state = 'menu';
let level = 1, cols = 0, rows = 0, arrows = [], occ = null, clocks = [], mask = null, shapeName = '', maxHearts = 3;
let hearts = 3, timeLeft = 0, timeTotal = 0, score = 0, levelScore = 0, combo = 0, lastClear = -9, dash = 0;

const inb = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;

function buildPts(a) {
  const pts = a.path.map(p => p.slice());
  const [hx, hy] = a.path[a.path.length - 1], [dx, dy] = DIRS[a.dir];

function launch(a, auto) {

  burst(px, py, a.rainbow ? null : C.arrow, a.rainbow ? 22 : 10);

function tapArrow(a) {
  if (!a || !a.alive || (a.anim && a.anim.type === 'bump')) return;
  const r = canExit(a);
  if (r.ok) { launch(a); return; }
  // 被挡住：前冲碰撞再弹回，扣爱心

  floaters.push({ x: px, y: py - cs * 0.3, text: r.blocker === a.id ? '撞到自己尾巴了！' : '前方有阻挡！', life: 1, col: C.red });

}

function useHint() {
  if (state !== 'play') return;
  if (hintId >= 0 && arrows[hintId].alive) return;
  if (hintsStock <= 0) { toast = { text: '提示用完了（每过一关 +1）', life: 1.6 }; return; }
  // 任意可飞出的箭头都是安全的；优先选挡住别人最多的那支
  let bestA = null, bestScore = -1;
  for (const a of arrows) if (a.alive && canExit(a).ok) {
    let blocks = 0; for (const b of arrows) if (b.alive && b !== a) { const r = canExit(b); if (!r.ok && r.blocker === a.id) blocks++; }
    if (blocks > bestScore) { bestScore = blocks; bestA = a; }
  }

}

function win() {

  const bonus = Math.round(timeLeft) * 5;
  score += bonus; levelScore += bonus;
  best = Math.max(best, score); maxLevel = Math.max(maxLevel, level + 1);
  hintsStock = Math.min(9, hintsStock + 1);
  timeFactor = Math.max(0.85, timeFactor * 0.97);
  lastResult = { stars, bonus, time: elapsed };
  persist(); sfx.win();
  for (let i = 0; i < 40; i++) burst(W / 2 + (Math.random() - 0.5) * W * 0.6, H * 0.3, null, 1);
}
function lose(reason) {

  best = Math.max(best, score); persist(); sfx.lose();

// ---------- 布局 ----------
// 性能：DPR 最多 2（3x 屏像素量减半以上）；只有尺寸真的变了才重建画布（重设 width/height 会清空并重新分配显存）

function resize(force) {
  const rc = cv.getBoundingClientRect(); cvRect = { left: rc.left, top: rc.top };
  const nW = Math.round(rc.width) || innerWidth, nH = Math.round(rc.height) || innerHeight, nD = Math.min(window.devicePixelRatio || 1, 2);
  if (!force && nW === W && nH === H && nD === DPR) return false;
  W = nW; H = nH; DPR = nD;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

}
let resizeTimer = 0;
function queueResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => resize(false), 120); }
function computeBoard() {
  const top = 112, bot = 96;

  cs = Math.max(8, Math.min(aw / cols, ah / rows, 62));
  bw = cs * cols; bh = cs * rows; ox = (W - bw) / 2; oy = top + 14 + (ah - bh) / 2;
  boardLayer = null;
}
// 离屏缓存层：棋盘底板+点阵（静态，只在开局/尺寸变化时画一次）、主菜单背景箭头
let boardLayer = null, menuLayer = null, dirty = true;
function makeLayer(w, h) {
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * DPR)); c.height = Math.max(1, Math.ceil(h * DPR));

}
function withCtx(g, fn) { const old = ctx; ctx = g; try { fn(); } finally { ctx = old; } }
function buildBoardLayer() {

  L.x = ox - m; L.y = oy - m;

    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (mask[cid(x, y)]) ctx.rect(ox + x * cs, oy + y * cs, cs, cs);
    ctx.fillStyle = C.board; ctx.strokeStyle = C.board; ctx.lineJoin = 'round'; ctx.lineWidth = sp * 2;
    ctx.shadowColor = 'rgba(0,0,0,.10)'; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0; ctx.fill();

// ---------- 粒子 / 飘字 ----------
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.4, col: col || `hsl(${Math.random() * 360},80%,60%)`, r: 2 + Math.random() * 3 });
  }
}

// ---------- 更新 ----------
function update(dt) {
  now += dt;
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 40 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt); dashFlash = Math.max(0, dashFlash - dt * 1.5);
  if (state !== 'play') return;
  elapsed += dt;
  if (endTimer === 0) timeLeft -= dt;
  dash = Math.max(0, dash - dt * 0.25);
  for (const a of arrows) {
    if (a.hitFlash) a.hitFlash = Math.max(0, a.hitFlash - dt);
    const an = a.anim; if (!an) continue;
    if (an.type === 'fly') {
      an.age += dt; an.s += (10 + 55 * an.age) * dt;

    } else if (an.type === 'bump') {
      an.t += dt; if (an.t >= an.dur) a.anim = null;
    }
  }
  if (rainbowQueue.length) {
    rainbowQueue = rainbowQueue.map(t => t - dt);
    while (rainbowQueue.length && rainbowQueue[0] <= 0) {
      rainbowQueue.shift();
      const free = arrows.filter(a => a.alive && !(a.anim && a.anim.type === 'bump') && canExit(a).ok);
      if (free.length) launch(free[Math.floor(Math.random() * free.length)], true);
    }
  }
  if (endTimer > 0) { endTimer += dt; if (endTimer > 0.6) { lose(loseReason); return; } }
  if (timeLeft <= 0 && endTimer === 0) { timeLeft = 0; lose('时间到了'); return; }

// ---------- 绘制 ----------
function ptAt(pts, t) {

}

}
function drawArrowShape(a, s, color, alpha, glow) {
  const t0 = s, t1 = s + a.L, pts = a.pts;

  list.push(ptAt(pts, t1));

  ctx.save(); ctx.globalAlpha = alpha;

    const h0 = (now * 120) % 360;

    stroke = g;

function drawHeart(x, y, s, filled) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 32, s / 32);
  ctx.beginPath(); ctx.moveTo(0, 10);
  ctx.bezierCurveTo(-16, -2, -14, -16, -6, -16); ctx.bezierCurveTo(-2, -16, 0, -13, 0, -10);
  ctx.bezierCurveTo(0, -13, 2, -16, 6, -16); ctx.bezierCurveTo(14, -16, 16, -2, 0, 10); ctx.closePath();
  if (filled) { ctx.fillStyle = C.heart; ctx.fill(); } else { ctx.strokeStyle = '#c9bfae'; ctx.lineWidth = 2.5; ctx.stroke(); }
  ctx.restore();
}
function drawClock(x, y, r) {
  ctx.save(); const pulse = 1 + Math.sin(now * 5) * 0.08;
  ctx.fillStyle = 'rgba(58,134,255,.16)'; ctx.beginPath(); ctx.arc(x, y, r * pulse * 1.45, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e7f0ff'; ctx.strokeStyle = C.blue; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y, r * pulse, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - r * 0.6); ctx.moveTo(x, y); ctx.lineTo(x + r * 0.45, y); ctx.stroke();
  ctx.fillStyle = C.blue; ctx.font = `bold ${Math.max(9, r * 0.6)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('+5', x, y + r * 1.05); ctx.restore();

function button(x, y, w, h, label, cb, style) {

  ctx.save();
  const primary = style === 'primary';
  ctx.fillStyle = 'rgba(0,0,0,.08)'; rr(x, y + 3, w, h, h / 2); ctx.fill();
  ctx.fillStyle = primary ? C.arrow : '#fff'; rr(x, y, w, h, h / 2); ctx.fill();
  if (!primary) { ctx.strokeStyle = '#ddd3c0'; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.fillStyle = primary ? '#fff' : C.text; ctx.font = `bold ${Math.round(h * 0.38)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = C.text; ctx.textBaseline = 'middle';
  ctx.font = `bold 22px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText(`第 ${level} 关`, 18, 34);
  ctx.textAlign = 'right'; ctx.font = `bold 18px ${FONT}`; ctx.fillText(`得分 ${score}`, W - 18, 34);
  for (let i = 0; i < maxHearts; i++) drawHeart(W / 2 - (maxHearts - 1) * 17 + i * 34, 36, 26, i < hearts);
  // 倒计时条
  const x = 18, y = 64, w = W - 36, h = 14, r = clamp(timeLeft / timeTotal, 0, 1);
  ctx.fillStyle = '#e4dccb'; rr(x, y, w, h, 7); ctx.fill();
  const col = r > 0.5 ? C.green : r > 0.2 ? '#e9c46a' : C.red;
  const blink = r <= 0.2 && Math.sin(now * 12) > 0;
  ctx.fillStyle = blink ? '#ff8a8a' : col; if (r > 0.01) { rr(x, y, Math.max(h, w * r), h, 7); ctx.fill(); }
  ctx.fillStyle = C.sub; ctx.font = `13px ${FONT}`; ctx.textAlign = 'left';
  const left = arrows.filter(a => a.alive).length;
  ctx.fillText(`剩余箭头 ${left}`, 18, 92);
  ctx.textAlign = 'right'; ctx.fillText(`⏱ ${Math.ceil(timeLeft)} 秒`, W - 18, 92);
  ctx.textAlign = 'center';
  if (combo >= 2 && elapsed - lastClear < 1.4) { ctx.fillStyle = C.gold; ctx.font = `bold 15px ${FONT}`; ctx.fillText(`连击 ×${combo}`, W / 2, 92); }
  else { ctx.fillStyle = C.sub; ctx.font = `13px ${FONT}`; ctx.fillText(`${DIFFS[diff].name} · ${shapeName}`, W / 2, 92); }
}

function drawBoard() {
  // 冲刺条：棋盘上下两条线槽

  }

    const a = arrows[hoverId], r2 = canExit(a), [hx, hy] = a.path[a.path.length - 1], [dx, dy] = DIRS[a.dir];
    const [sx, sy] = cellXY(hx, hy);

    let s = 0, color = C.arrow, glow = null;
    if (a.anim && a.anim.type === 'bump') { const p = a.anim.t / a.anim.dur; s = a.anim.dist * Math.sin(Math.PI * p); color = C.red; }
    if (a.hitFlash > 0) color = C.red;
    if (a.id === hintId) { glow = C.green; color = Math.sin(now * 8) > 0 ? C.green : C.arrow; }

}

function drawPlay() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake / 0.3, (Math.random() - 0.5) * 6 * shake / 0.3);
  drawHUD(); drawBoard();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(230,57,70,${flash * 0.4})`; ctx.fillRect(0, 0, W, H); }
  const bw2 = Math.min(150, (W - 60) / 3), by = H - 70;
  if (state === 'play') {
    button(W / 2 - bw2 * 1.5 - 12, by, bw2, 48, '主页', () => { state = 'menu'; });
    button(W / 2 - bw2 / 2, by, bw2, 48, `提示 (${hintsStock})`, useHint, 'primary');
    button(W / 2 + bw2 / 2 + 12, by, bw2, 48, '重开', () => startLevel(level));
  }
}

function drawFX() {
  for (const p of particles) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life * 2, 0, 1); ctx.fillStyle = f.col; ctx.font = `bold ${f.big ? 26 : 16}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillText(f.text, f.x, f.y);
  }

// 主菜单的装饰箭头
const menuDeco = (() => { const g = genLevel(5, 0, { mc: 10, mr: 13 }); g.arrows.forEach((a, i) => { a.id = i; a.alive = true; }); return g; })();

function drawPanel(title, sub, lines, btns) {

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  lines.forEach((l, i) => ctx.fillText(l, W / 2, py + 150 + i * 24));

function render() {

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

        [`本关得分 ${levelScore}（含剩余时间奖励 ${lastResult.bonus}）`, `用时 ${lastResult.time.toFixed(1)} 秒 · 总分 ${score}`],
        [['重玩', () => { score = Math.max(0, score - levelScore); startLevel(level); }], ['下一关', () => startLevel(level + 1)]]);

        [['主页', () => { state = 'menu'; }], ['再试一次', () => { score = Math.max(0, score - levelScore); startLevel(level); }]]);

// ---------- 输入（鼠标 + 触屏统一用 Pointer Events） ----------
function segDist(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, L = vx * vx + vy * vy, t = L ? clamp(((px - ax) * vx + (py - ay) * vy) / L, 0, 1) : 0;
  return Math.hypot(px - ax - vx * t, py - ay - vy * t);
}
function arrowAt(px, py) {

  if (inb(gx, gy)) { const o = occ[cid(gx, gy)]; if (o >= 0 && arrows[o].alive) return arrows[o]; }
  // 容错：点在空格/挖空处时，选离手指最近的箭头线段（触屏至少 22px 的判定半径）
  const tol = Math.max(0.62, (pointerType === 'mouse' ? 10 : 22) / cs);
  let bestA = null, bd = tol;
  for (const a of arrows) if (a.alive) {

    let dd = segDist(fx, fy, h[0], h[1], h[0] + dx * 0.4, h[1] + dy * 0.4);
    for (let i = 0; i < P.length - 1; i++) dd = Math.min(dd, segDist(fx, fy, P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]));
    if (dd < bd) { bd = dd; bestA = a; }

cv.addEventListener('pointerdown', e => {
  pointerType = e.pointerType || 'mouse';
  e.preventDefault(); dirty = true;
  unlockAudio();
  const rc0 = cv.getBoundingClientRect(); const x = e.clientX - rc0.left, y = e.clientY - rc0.top;
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sfx.click(); b.cb(); return; }
  if (state === 'play' && endTimer === 0) tapArrow(arrowAt(x, y));
});
cv.addEventListener('pointermove', e => {
  pointerType = e.pointerType || 'mouse';
  if (pointerType !== 'mouse') return; // 触屏不需要悬停，省掉每次 move 的命中计算
  const mx = e.clientX - cvRect.left, my = e.clientY - cvRect.top;
  if (state === 'play') { const a = arrowAt(mx, my), h = a ? a.id : -1; if (h !== hoverId) { hoverId = h; dirty = true; } }
  let over = false; for (const b of buttons) if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) over = true;

addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'h' || e.key === 'H') useHint();
  if (e.key === 'r' || e.key === 'R') startLevel(level);
});
// 尺寸事件去抖：iOS standalone 下 resize / visualViewport / 旋转事件会连发，只在稳定后且尺寸真变时重建
addEventListener('resize', queueResize);
addEventListener('orientationchange', queueResize);
if (window.visualViewport) visualViewport.addEventListener('resize', queueResize);
// 禁止 iOS 双击缩放、双指缩放、页面回弹滚动
['gesturestart', 'gesturechange', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
// 不再在 touchend 上 preventDefault（快速连点会被吞）；双击缩放已由 touch-action:none + 只用 pointerdown 处理
['contextmenu', 'selectstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
// 离线缓存（Service Worker），相对路径适配 GitHub Pages 子路径
window.__swStatus = 'unsupported';
if ('serviceWorker' in navigator) {
  window.__swStatus = 'pending';

      .then(() => { window.__swStatus = 'ready'; })

}

// ---------- 主循环 ----------
// 空闲降帧：没有动画/粒子时，游戏中 10fps 刷新倒计时，结算面板 4fps；有动画或输入时满帧
let last = performance.now(), lastRender = 0, rafId = 0, running = false, lastFrameAt = 0;

  return false;
}
function frame(t) {

// 切到后台暂停循环；回到前台 / 从 bfcache 恢复时重算尺寸、恢复循环和音频，并重置计时基准（不会一次扣掉后台时长）

});
addEventListener('pageshow', () => { resize(false); stopLoop(); startLoop(); });
addEventListener('focus', () => { if (!document.hidden) startLoop(); });
// 看门狗：iOS 主屏幕模式偶发 rAF 停摆，1.5 秒没帧就重启循环

resize(true); startLoop();

// 调试/测试接口
window.__game = {
  get state() { return state; }, get level() { return level; }, get hearts() { return hearts; },
  get left() { return arrows.filter(a => a.alive).length; }, get score() { return score; },
  start(n) { score = 0; startLevel(n || 1); },
  tapFree() { const a = arrows.find(a => a.alive && canExit(a).ok); if (a) tapArrow(a); return !!a; },
  tapBlocked() { const a = arrows.find(a => a.alive && !canExit(a).ok); if (a) tapArrow(a); return !!a; },

  // 用“每轮把所有可飞箭头一起放飞”的贪心模拟验证必有解；同时统计开局可飞数与解题深度（轮数）

      while (x >= 0 && y >= 0 && x < g.cols && y < g.rows) { if (occ2[y * g.cols + x] >= 0) return false; x += dx; y += dy; } return true; };

    let cells = 0; for (const m of g.mask) cells += m; let used = 0; for (const a of g.arrows) used += a.path.length;
    const lens = g.arrows.map(a => a.path.length), bends = g.arrows.reduce((s, a) => { let b = 0; for (let i = 2; i < a.path.length; i++) { const p = a.path; if ((p[i][0] - p[i - 1][0]) !== (p[i - 1][0] - p[i - 2][0]) || (p[i][1] - p[i - 1][1]) !== (p[i - 1][1] - p[i - 2][1])) b++; } return s + b; }, 0);
